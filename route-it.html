<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORKFLOW RESCUE 2030</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0%,#075f6055,transparent 40%),repeating-linear-gradient(90deg,transparent 0 39px,#00d6c608 40px),#050b13;color:#f2faff;font-family:Tahoma,Arial,sans-serif;line-height:1.8}main{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #366773;padding-bottom:12px}.logos img{width:65px;height:55px;object-fit:contain}.kicker{color:#00d6c6;font-size:12px;letter-spacing:1px}h1{font-size:clamp(25px,4vw,43px);margin:14px 0 0}.muted{color:#a8b5cc}.glass{background:#102330dc;border:1px solid #306270;border-radius:18px;padding:19px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{background:#0b2a37;border:1px solid #245364;border-radius:12px;padding:12px}.stat strong{font-size:27px;color:#00e5ff;display:block}.stat small{color:#a8b5cc}.layout{display:grid;grid-template-columns:290px 1fr;gap:15px}.side{display:grid;gap:9px;align-content:start}.case{display:block;text-align:right;width:100%;background:#0d2836;border:1px solid #315d6b;border-radius:12px;padding:13px;color:white;min-height:78px;cursor:pointer}.case.active{border:2px solid #00d6c6;background:#124046}.case b{display:block}.case small{color:#a8b5cc}.badge{border:1px solid #f2b544;color:#f2b544;border-radius:30px;padding:3px 9px;font-size:12px;white-space:nowrap}.badge.good{color:#3ee07f;border-color:#3ee07f}.badge.bad{color:#ff5c7a;border-color:#ff5c7a}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h2{margin:0;font-size:22px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.btn{background:#183747;border:1px solid #387586;color:#f2faff;border-radius:11px;min-height:48px;padding:10px 15px;font:inherit;cursor:pointer}.btn:hover,.btn.on{border-color:#00e5ff;background:#16525c}.btn.primary{background:linear-gradient(100deg,#00d6c6,#00e5ff);color:#03282c;border:0;font-weight:bold}.btn:disabled{opacity:.35;cursor:not-allowed}.evidence{background:#071a26;border:1px solid #335664;border-radius:12px;padding:17px;min-height:195px}.evidence p{margin:8px 0}.evidence h3{color:#72f5ee;margin:0 0 12px}.rowdata{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.datum{background:#102f3b;padding:10px;border-radius:9px}.datum small{display:block;color:#a8b5cc}.timeline{border-right:2px solid #00d6c6;padding-right:15px}.timeline p{margin:13px 0}.options{display:grid;gap:9px}.option{text-align:right;width:100%;border:1px solid #386777;border-radius:11px;background:#122f40;color:white;padding:13px;font:inherit;cursor:pointer;min-height:53px}.option.on{border:2px solid #00d6c6;background:#0c4b4e}.feedback{padding:15px;border-radius:12px;background:#0b2d3a;border:1px solid #477282;margin:12px 0}.feedback.good{border-color:#3ee07f}.feedback.bad{border-color:#ff5c7a}.bar{height:8px;background:#25424f;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#00d6c6;transition:.2s}.score{font-size:56px;color:#00e5ff;font-weight:bold}.level{font-size:24px;color:#73f8ec}.footer{text-align:center;font-size:12px;color:#a8b5cc;margin:28px 0}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,1fr)}.rowdata{grid-template-columns:1fr}}@media(max-width:480px){.side{grid-template-columns:1fr}main{padding:10px}.glass{padding:13px}.stat strong{font-size:21px}}
</style></head><body><main><header class="top"><div class="logos"><img src="deanship.png" alt="شعار العمادة" onerror="this.style.display='none'"><img src="club.png" alt="شعار النادي" onerror="this.style.display='none'"></div><span class="kicker" dir="ltr">OFFICE TECH 2030 · ZONE 03 / 06</span></header><p class="kicker" dir="ltr">OFFICE OS 2030 · MISSION CONTROL</p><h1>WORKFLOW RESCUE 2030</h1><p class="muted">غرفة إنقاذ المعاملات | افحصي الأدلة، اكتشفي الخلل، ونفّذي التدخل الصحيح</p><div id="app"></div><footer class="footer">نموذج تدريبي ببيانات وهمية · OFFICE TECH 2030</footer></main><script>
const cases=[
{id:'2030-041',name:'ورشة مهارات العمل الرقمي',summary:'طلب تدريب توقّف عند التحقق.',file:[['النوع','تدريب'],['التكلفة','4,500 ريال'],['اسم المدربة','—'],['عدد المشاركات','40'],['حالة الملف','بانتظار التحقق']],log:['08:40 · استلام طلب الورشة','08:42 · إنشاء سجل المعاملة','08:43 · محاولة الانتقال للمرحلة التالية لم تكتمل'],extra:'يشترط نموذج الورشة اكتمال بيانات المدربة قبل الإحالة.',causes:['نقص أحد الحقول الأساسية','توجيه الطلب لجهة غير مختصة','تجاوز مهلة التصعيد'],ci:0,actions:['طلب استكمال البيانات من وحدة التدريب','إحالة الطلب للمراجعة المالية فورًا','إغلاق الطلب وفتح معاملة جديدة'],ai:0,why:'اسم المدربة غير موجود. يجب طلب استكماله قبل تمرير المعاملة.',tip:'افحصي اكتمال البيانات قبل البحث عن مشكلات التوجيه والاعتماد.'},
{id:'IT-2030-02',name:'حسابات منصة المشاركات',summary:'طلب خدمة تقنية بلا تقدم منذ وصوله.',file:[['نوع الخدمة','إنشاء حسابات'],['التكلفة','0 ريال'],['الجهة المستقبلة','المرافق'],['الحالة','قيد الانتظار']],log:['09:05 · إنشاء طلب حسابات المشاركات','09:07 · إحالته إلى وحدة المرافق','11:00 · لم تسجّل خطوة تنفيذية'],extra:'تتولى تقنية المعلومات إنشاء الحسابات وإدارة صلاحيات المنصات.',causes:['تأخر اعتماد الميزانية','توجيه الطلب لجهة غير مختصة','انتهاء صلاحية الحسابات'],ci:1,actions:['إحالته إلى المالية','إعادة توجيهه لتقنية المعلومات وتوثيق السبب','تصعيده مباشرة للرئيسة التنفيذية'],ai:1,why:'نوع الخدمة تقني بينما الجهة المستقبلة المرافق؛ يلزم تصحيح التوجيه.',tip:'حددي الجهة من طبيعة الخدمة لا من اسم المشروع.'},
{id:'2030-040',name:'ترخيص منصة التعلم',summary:'طلب شراء خدمات مفتوح منذ عدة أيام.',file:[['نوع الطلب','شراء خدمات'],['التكلفة','13,800 ريال'],['عمر الطلب','144 ساعة'],['الحالة','بانتظار خطوة نهائية']],log:['اليوم الأول · تسجيل الطلب','اليوم الثاني · اكتمال المراجعة المالية','اليوم الثالث · إحالة لصاحبة الصلاحية','اليوم السادس · لا يوجد اعتماد مسجل'],extra:'لا يجوز تنفيذ التزام مالي قبل اعتماد صاحبة الصلاحية، والتأخير بعد 72 ساعة يستدعي تصعيدًا.',causes:['غياب المراجعة المالية','تأخر اعتماد صاحبة الصلاحية بعد اكتمال المراجعة','الطلب بلا تكلفة ويحتاج اعتمادًا آليًا'],ci:1,actions:['اعتماد المعاملة آليًا','إلغاء الطلب وبدء طلب جديد','تصعيد التأخير لصاحبة الصلاحية مع توثيق الأثر'],ai:2,why:'المراجعة المالية مكتملة لكن الاعتماد البشري متأخر؛ التصعيد لا يعني الاعتماد نيابة عن المسؤولة.',tip:'ميّزي بين التصعيد وصلاحية الاعتماد.'},
{id:'MAINT-2030-04',name:'صيانة شاشة قاعة الأفق',summary:'طلب مرافق وصل للتنفيذ بسرعة غير معتادة.',file:[['الخدمة','صيانة شاشة'],['التكلفة','800 ريال'],['الجهة','المرافق'],['المراجعة المالية','لم تُطلب'],['الاعتماد','آلي']],log:['10:00 · استلام طلب الصيانة','10:02 · تحويله إلى المرافق','10:03 · تسجيل اعتماد آلي','10:04 · جاهز للتنفيذ'],extra:'المراجعة المالية فقط فوق 1,000 ريال، لكن أي تكلفة تحتاج اعتمادًا بشريًا.',causes:['غياب المراجعة المالية','اعتماد التزام مالي دون موافقة بشرية','توجيه الطلب إلى المرافق'],ci:1,actions:['إضافة مراجعة مالية إجبارية','استكمال التنفيذ لأن المبلغ صغير','تعليق التنفيذ وإحالته لاعتماد بشري دون مراجعة مالية إضافية'],ai:2,why:'800 ريال لا تتطلب مراجعة مالية، لكنها تحتاج اعتماد صاحبة الصلاحية.',tip:'لا تخلطي بين حد المراجعة المالية وشرط الاعتماد.'},
{id:'M-2030-08',name:'حجز غرفة الابتكار 3',summary:'حجز داخلي مكتمل لم يُنهَ.',file:[['نوع الطلب','حجز داخلي'],['التكلفة','0 ريال'],['الغرفة','متاحة'],['البيانات','مكتملة'],['الحالة','بانتظار توقيع']],log:['12:10 · تقديم الحجز','12:11 · التحقق من توفر الغرفة','12:12 · تحويله للاعتماد اليدوي','13:00 · لم يُستكمل الحجز'],extra:'الحجوزات الداخلية المكتملة بلا تكلفة لا تتطلب اعتمادًا بشريًا.',causes:['تجاوز المهلة الزمنية','انتظار توقيع غير مطلوب','الغرفة غير متاحة'],ci:1,actions:['تطبيق الاعتماد الآلي وإتمام الحجز','إحالته إلى الشؤون المالية','إلغاء الحجز وإعادة تقديمه'],ai:0,why:'الطلب بلا تكلفة وبياناته مكتملة؛ مرحلة التوقيع اليدوي غير لازمة.',tip:'تحققي هل المرحلة ضابط مطلوب أم انتظار بلا قيمة.'}
];
const policy=['التدريب ← وحدة التدريب، التقنية ← تقنية المعلومات، المرافق ← المرافق، شراء الخدمات ← الشؤون الإدارية.','أي التزام مالي يتجاوز 1,000 ريال يمر بالمراجعة المالية.','كل طلب فيه تكلفة يحتاج اعتماد صاحبة الصلاحية. الطلبات الداخلية بلا تكلفة تُعتمد آليًا بعد استيفاء الشروط.','إذا تجاوز عمر الطلب 72 ساعة دون إنجاز، يلزم التنبيه والتصعيد، ولا يجوز تجاوز صلاحية الاعتماد.'];

let progress=[],active=0,tab='file',step='inspect',cause=-1,action=-1,seen=new Set();const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function reset(){progress=cases.map(()=>({done:false,ok:false,ci:-1,ai:-1}));active=0;tab='file';step='inspect';cause=-1;action=-1;seen=new Set();render()}
function choose(i){active=i;tab='file';step=progress[i].done?'done':'inspect';cause=-1;action=-1;seen=new Set();render()}
function selectTab(t){tab=t;seen.add(t);render()}
function setCause(i){cause=i;render()}
function setAction(i){action=i;render()}
function submit(){let p=progress[active],c=cases[active];p.done=true;p.ok=cause===c.ci&&action===c.ai;p.ci=cause;p.ai=action;step='done';render()}
function next(){let i=progress.findIndex(x=>!x.done);if(i<0)renderFinal();else choose(i)}
function intervention(c,p){if(p.done)return `<div class="feedback ${p.ok?'good':'bad'}"><h3>${p.ok?'✓ تم إنقاذ المعاملة':'✕ المعالجة تحتاج مراجعة'}</h3><p>${esc(c.why)}</p>${p.ok?'':`<p>التشخيص الصحيح: ${esc(c.causes[c.ci])}</p><p>الإجراء الصحيح: ${esc(c.actions[c.ai])}</p>`}</div><button id="advance" class="btn primary">${progress.every(x=>x.done)?'عرض تقييمي النهائي':'المعاملة التالية'} ←</button>`;
if(step==='inspect')return `<div class="actions"><button id="begin" class="btn primary" ${seen.size<2?'disabled':''}>ابدئي التحقيق الإداري ←</button><span class="muted">افتحي قسمين على الأقل من الأدلة قبل التدخل.</span></div>`;
if(step==='diagnose')return `<h3>المرحلة 1 · ما السبب الرئيسي للتعثر؟</h3><div class="options">${c.causes.map((x,i)=>`<button class="option ${cause===i?'on':''}" data-cause="${i}">${esc(x)}</button>`).join('')}</div><button id="go" class="btn primary" ${cause<0?'disabled':''}>انتقلي إلى التدخل ←</button>`;
return `<h3>المرحلة 2 · ما التدخل الذي ستنفذينه؟</h3><p class="muted">راجعي الأدلة والسياسة قبل تنفيذ الإجراء.</p><div class="options">${c.actions.map((x,i)=>`<button class="option ${action===i?'on':''}" data-action="${i}">${esc(x)}</button>`).join('')}</div><div class="actions"><button id="confirm" class="btn primary" ${action<0?'disabled':''}>نفّذي الإجراء</button><button id="back" class="btn">راجعي التشخيص</button></div>`}
function render(){let done=progress.filter(x=>x.done).length,ok=progress.filter(x=>x.ok).length,c=cases[active],p=progress[active];if(done===5){renderFinal();return}app.innerHTML=`<div class="stats"><div class="stat"><strong>05</strong><small>المعاملات</small></div><div class="stat"><strong>${done}</strong><small>تمت معالجتها</small></div><div class="stat"><strong>${ok}</strong><small>تم إنقاذها بنجاح</small></div></div><div class="layout"><aside class="side">${cases.map((x,i)=>`<button class="case ${active===i?'active':''}" data-case="${i}"><b>${esc(x.name)}</b><small dir="ltr">${esc(x.id)}</small><div><span class="badge ${progress[i].done?(progress[i].ok?'good':'bad'):''}">${progress[i].done?(progress[i].ok?'تم الإنقاذ':'تحتاج مراجعة'):'بانتظار التدخل'}</span></div></button>`).join('')}</aside><section class="glass"><div class="head"><div><span class="kicker">CASE ${String(active+1).padStart(2,'0')} · SYSTEM REVIEW</span><h2>${esc(c.name)}</h2><p class="muted">${esc(c.summary)}</p></div><span class="badge ${p.done?(p.ok?'good':'bad'):''}">${p.done?(p.ok?'تم الإنقاذ':'تحتاج مراجعة'):'تحتاج تدخّلًا'}</span></div><div class="tabs"><button class="btn ${tab==='file'?'on':''}" data-tab="file">▤ ملف المعاملة</button><button class="btn ${tab==='log'?'on':''}" data-tab="log">◷ سجل التتبع</button><button class="btn ${tab==='policy'?'on':''}" data-tab="policy">◇ السياسات</button></div><div class="evidence">${tab==='file'?`<h3>ملف المعاملة</h3><div class="rowdata">${c.file.map(x=>`<div class="datum"><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong></div>`).join('')}</div>`:tab==='log'?`<h3>سجل التتبع</h3><div class="timeline">${c.log.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:`<h3>السياسات والإرشادات</h3>${policy.map(x=>`<p>• ${esc(x)}</p>`).join('')}<p style="color:#73f5ed">ملاحظة الملف: ${esc(c.extra)}</p>`}</div><div id="intervention">${intervention(c,p)}</div></section></div>`;
app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>choose(+b.dataset.case));app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));app.querySelectorAll('[data-cause]').forEach(b=>b.onclick=()=>setCause(+b.dataset.cause));app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>setAction(+b.dataset.action));let bind=(id,fn)=>{let b=app.querySelector('#'+id);if(b)b.onclick=fn};bind('begin',()=>{step='diagnose';render()});bind('go',()=>{step='act';render()});bind('confirm',submit);bind('advance',next);bind('back',()=>{step='diagnose';render()})}
function renderFinal(){let score=progress.filter(x=>x.ok).length;let levels=[['مستكشفة الأنظمة','WORKFLOW EXPLORER','راجعي بيانات المعاملة وسجلها قبل اتخاذ القرار.'],['محللة المعاملات','WORKFLOW ANALYST','لديك أساس جيد، لكن بعض قراراتك تحتاج إلى تحقق إضافي.'],['خبيرة إنقاذ المعاملات','WORKFLOW RESCUE EXPERT','أظهرت قدرة قوية على معالجة التعثرات مع احترام الضوابط.'],['مهندسة سير العمل','WORKFLOW ARCHITECT','نجحت في جميع الحالات ووازنت بين سرعة الإنجاز وسلامة الإجراءات.']];let l=levels[score===5?3:score===4?2:score>=2?1:0];app.innerHTML=`<section class="glass" style="max-width:850px;margin:25px auto;text-align:center"><p class="kicker" dir="ltr">YOUR WORKFLOW DNA · FINAL ASSESSMENT</p><h2>بصمتكِ في إدارة المعاملات</h2><div class="score">${score} / 5</div><p class="kicker" dir="ltr">${l[1]}</p><h2 class="level">${l[0]}</h2><p>${l[2]}</p><div class="bar"><div style="width:${score*20}%"></div></div><h3>${score>=4?'✓ استحققتِ ختم الركن الثالث!':'يمكنك تحسين مستواك وإعادة المحاولة'}</h3><div style="text-align:right"><h3>توصياتكِ للتطوير</h3>${progress.map((p,i)=>p.ok?'':`<div class="feedback"><strong>${esc(cases[i].name)}</strong><p>${esc(cases[i].tip)}</p></div>`).join('')||'<p class="feedback good">ممتاز! انتقلي من معالجة الأخطاء إلى تصميم إجراءات تمنع وقوعها.</p>'}</div><button class="btn primary" id="restart">أعيدي التحدي وحسّني مستواكِ</button></section>`;app.querySelector('#restart').onclick=reset}
reset();

</script></body></html>
